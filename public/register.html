<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Wang's Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" style="font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--text-primary);letter-spacing:-0.02em">
                    Wang's<span style="color:var(--accent-highlight)">.</span>Notebook
                </a>
                <h1 style="margin-top:1.5rem">创建账号</h1>
                <p>加入我们，一起记录与分享</p>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="3-20 位字母、数字或下划线" required minlength="3" maxlength="20">
                </div>

                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="至少 6 位" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">确认密码</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="再次输入密码" required minlength="6">
                </div>

                <div class="form-error" id="form-error"></div>

                <button type="submit" class="auth-submit" id="submit-btn">注册</button>
            </form>

            <div class="auth-footer">
                已有账号？<a href="login.html">立即登录</a>
            </div>

            <div style="text-align:center;margin-top:1.5rem">
                <a href="index.html" style="color:var(--text-tertiary);font-size:0.85rem">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('form-error');
            const submitBtn = document.getElementById('submit-btn');

            errorEl.classList.remove('show');

            // Validation
            if (password !== confirmPassword) {
                errorEl.textContent = '两次输入的密码不一致';
                errorEl.classList.add('show');
                return;
            }

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                errorEl.textContent = '用户名只能包含字母、数字和下划线，长度 3-20 位';
                errorEl.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '注册中...';

            try {
                const { ok, data } = await apiRequest('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, email, password })
                });

                if (ok) {
                    setAuth(data.token, data.user);
                    showToast('注册成功', 'success');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    errorEl.textContent = data.error || '注册失败';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '注册';
            }
        }
    </script>
</body>
</html>
