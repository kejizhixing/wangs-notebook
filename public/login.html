<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Wang's Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" style="font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--text-primary);letter-spacing:-0.02em">
                    Wang's<span style="color:var(--accent-highlight)">.</span>Notebook
                </a>
                <h1 style="margin-top:1.5rem">欢迎回来</h1>
                <p>登录后可以发表评论、收藏文章</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名或邮箱</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <div class="form-error" id="form-error"></div>

                <button type="submit" class="auth-submit" id="submit-btn">登录</button>
            </form>

            <div class="auth-footer">
                还没有账号？<a href="register.html">立即注册</a>
            </div>

            <div style="text-align:center;margin-top:1.5rem">
                <a href="index.html" style="color:var(--text-tertiary);font-size:0.85rem">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('form-error');
            const submitBtn = document.getElementById('submit-btn');

            errorEl.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';

            try {
                const { ok, data } = await apiRequest('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                if (ok) {
                    setAuth(data.token, data.user);
                    showToast('登录成功', 'success');

                    // Redirect back or to home
                    const redirectUrl = new URLSearchParams(window.location.search).get('redirect');
                    setTimeout(() => {
                        window.location.href = redirectUrl || 'index.html';
                    }, 500);
                } else {
                    errorEl.textContent = data.error || '登录失败';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        }
    </script>
</body>
</html>
